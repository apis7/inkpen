[package]
name = "inkpen"
version = "0.1.0"
description = "A minimalist, lightning-fast editor for Markdown and common text formats."
edition = "2021"
rust-version = "1.77"

[lib]
name = "inkpen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri reads production-vs-dev off this feature and nothing else: its build
# script sets `dev = !custom-protocol`. A plain `cargo build --release` is
# therefore still a *dev* build — it embeds the dev server URL instead of the
# bundled frontend, and the installed result shows "can't reach this page" with
# no other clue. `tauri build` passes the feature for you; a bare cargo build
# needs `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
sha2 = "0.10"
dirs = "5"
toml = "0.8"
notify = "8.2.0"
notify-debouncer-full = "0.6.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
